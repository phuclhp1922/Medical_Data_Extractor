[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-vlm-curator"
version = "0.1.0"
description = "Curates medical visual-reasoning data from case reports with a calibrated LLM judge."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
# NOTE: the MIT license covers the CODE only. The curated dataset derives from
# copyrighted source material and is NOT redistributable. See README.md (and
# DATASHEET.md, planned) - do not restate the dataset terms inside LICENSE itself.

dependencies = [
    "langgraph>=0.2",
    "openai>=1.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "pandas>=2.2",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Calibration / agreement statistics. Separate so the pipeline runs without
# pulling scikit-learn and matplotlib.
eval = [
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "matplotlib>=3.9",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "nbstripout>=0.7",
]

# NOTE: the PDF -> markdown extraction stage is deliberately NOT declared here.
# The golden corpus was produced with mineru==2.5.4 (recorded in each case's
# _middle.json as _version_name). That stage is reproducibility documentation,
# not capability - it is deferred until after calibration. See PLAN.md.

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Archived prototype notebooks are a historical record, kept verbatim as evidence
# for the findings in PLAN.md. Linting them is noise (151 findings, none in src/),
# and reformatting them would destroy their value as a record.
extend-exclude = ["notebooks/archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is prose sent verbatim to a model, not code. Re-wrapping a line changes the
# bytes the model sees -- and once T2 step 6 hashes RULES, it changes the version hash too.
# Same reasoning as extend-exclude above. F/I/UP/B still apply: those catch real defects.
"src/curator/prompts/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests needing the real corpus are marked `corpus`; tests that spend API
# tokens are marked `live`. Neither runs by default.
addopts = "-m 'not live'"
markers = [
    "live: hits a real LLM API and costs money",
    "corpus: requires the local MinerU corpus (not redistributable)",
]
